services:
    api:
        build: .
        expose:
            - "8000"
        volumes:
            - ./.storage:/app/.storage
            - ./.models:/app/.models
        env_file:
            - .env
        restart: unless-stopped

    caddy:
        image: caddy:2
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - api
        env_file:
            - .env
        restart: unless-stopped

volumes:
    caddy_data:
    caddy_config:
